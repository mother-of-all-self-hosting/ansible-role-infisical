---
- name: Verify Infisical systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Infisical service to become active (up to 180s)
      ansible.builtin.systemd:
        name: infisical.service
      register: infisical_service
      until: infisical_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Infisical service is active
      ansible.builtin.assert:
        that: infisical_service.status.ActiveState == 'active'
        fail_msg: "infisical.service not active ({{ infisical_service.status.ActiveState }})"
        success_msg: "infisical.service is active"

    - name: Retrieve Infisical service log for debugging
      when: infisical_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu infisical.service
      changed_when: false

    - name: Wait for Infisical HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8080/"
        method: GET
        status_code: [200, 302, 307]
        follow_redirects: none
      register: infisical_endpoint
      until: infisical_endpoint.status in [200, 302, 307]
      retries: 120
      delay: 5

    - name: Assert Infisical HTTP endpoint responds
      ansible.builtin.assert:
        that: infisical_endpoint.status in [200, 302, 307]
        fail_msg: "Infisical did not respond as expected ({{ infisical_endpoint.status | default('no response') }})"
        success_msg: "Infisical responded with {{ infisical_endpoint.status }}"

    - name: Show Infisical systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Infisical systemd: {{ infisical_service.status.ActiveState }}"
          - "Infisical HTTP: {{ infisical_endpoint.status }}"
