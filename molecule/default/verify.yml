---
- name: Verify Teable systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Teable service to become active (up to 180s)
      ansible.builtin.systemd:
        name: teable.service
      register: teable_service
      until: teable_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Teable service is active
      ansible.builtin.assert:
        that: teable_service.status.ActiveState == 'active'
        fail_msg: "teable.service not active ({{ teable_service.status.ActiveState }})"
        success_msg: "teable.service is active"

    - name: Retrieve Teable service log for debugging
      when: teable_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu teable.service
      changed_when: false

    - name: Wait for Teable HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:3000/"
        method: GET
        status_code: [200, 302, 307]
        follow_redirects: none
      register: teable_endpoint
      until: teable_endpoint.status in [200, 302, 307]
      retries: 120
      delay: 5

    - name: Assert Teable HTTP endpoint responds
      ansible.builtin.assert:
        that: teable_endpoint.status in [200, 302, 307]
        fail_msg: "Teable did not respond as expected ({{ teable_endpoint.status | default('no response') }})"
        success_msg: "Teable responded with {{ teable_endpoint.status }}"

    - name: Show Teable systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Teable systemd: {{ teable_service.status.ActiveState }}"
          - "Teable HTTP: {{ teable_endpoint.status }}"
