---
# Project source code URL: https://github.com/Infisical/infisical

infisical_enabled: true

infisical_identifier: infisical
infisical_base_path: "/{{ infisical_identifier }}"

# renovate: datasource=docker depName=infisical/infisical
infisical_version: v0.162.19

infisical_uid: ""
infisical_gid: ""

# The scheme used for serving Infisical.
infisical_scheme: https

# The hostname at which Infisical is served.
infisical_hostname: ""

# The path at which Infisical is served.
# This value must either be `/` or not end with a slash (e.g. `/infisical`).
infisical_path_prefix: /

infisical_container_image: "{{ infisical_container_image_registry_prefix }}infisical/infisical:{{ infisical_container_image_tag }}"
infisical_container_image_tag: "{{ infisical_version }}"
infisical_container_image_registry_prefix: "{{ infisical_container_image_registry_prefix_upstream }}"
infisical_container_image_registry_prefix_upstream: "{{ infisical_container_image_registry_prefix_upstream_default }}"
infisical_container_image_registry_prefix_upstream_default: docker.io/
# TODO: add tasks to self-build the image

# The base container network. It will be auto-created by this role if it doesn't exist already.
infisical_container_network: "{{ infisical_identifier }}"

# Control if the container network is deleted on uninstalling.
infisical_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `infisical_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
infisical_container_http_host_bind_port: ""

# The port number in the container
infisical_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
infisical_container_additional_networks: "{{ infisical_container_additional_networks_auto + infisical_container_additional_networks_custom }}"
infisical_container_additional_networks_auto: []
infisical_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
infisical_container_additional_volumes: "{{ infisical_container_additional_volumes_auto + infisical_container_additional_volumes_custom }}"
infisical_container_additional_volumes_auto: []
infisical_container_additional_volumes_custom: []

# infisical_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `infisical_container_labels_additional_labels_custom`.
infisical_container_labels_traefik_enabled: true
infisical_container_labels_traefik_docker_network: "{{ infisical_container_network }}"
infisical_container_labels_traefik_hostname: "{{ infisical_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/infisical`).
infisical_container_labels_traefik_path_prefix: "{{ infisical_path_prefix }}"
infisical_container_labels_traefik_rule: "Host(`{{ infisical_container_labels_traefik_hostname }}`){% if infisical_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ infisical_container_labels_traefik_path_prefix }}`){% endif %}"
infisical_container_labels_traefik_priority: 0
infisical_container_labels_traefik_entrypoints: web-secure
infisical_container_labels_traefik_tls: "{{ infisical_container_labels_traefik_entrypoints != 'web' }}"
infisical_container_labels_traefik_tls_certResolver: default  # noqa var-naming
infisical_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
infisical_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `infisical_container_labels_traefik_additional_request_headers_custom`
infisical_container_labels_traefik_additional_request_headers: "{{ infisical_container_labels_traefik_additional_request_headers_auto | combine(infisical_container_labels_traefik_additional_request_headers_custom) }}"
infisical_container_labels_traefik_additional_request_headers_auto: {}
infisical_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `infisical_container_labels_traefik_additional_response_headers_custom`
infisical_container_labels_traefik_additional_response_headers: "{{ infisical_container_labels_traefik_additional_response_headers_auto | combine(infisical_container_labels_traefik_additional_response_headers_custom) }}"
infisical_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': infisical_http_header_xss_protection} if infisical_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': infisical_http_header_content_type_options} if infisical_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': infisical_http_header_content_security_policy} if infisical_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': infisical_http_header_permissions_policy} if infisical_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': infisical_http_header_strict_transport_security} if infisical_http_header_strict_transport_security and infisical_container_labels_traefik_tls else {})
  }}
infisical_container_labels_traefik_additional_response_headers_custom: {}

# infisical_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `infisical_container_labels_additional_labels_custom`
#
# Example:
# infisical_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
infisical_container_labels_additional_labels: "{{ infisical_container_labels_additional_labels_auto + infisical_container_labels_additional_labels_custom }}"
infisical_container_labels_additional_labels_auto: []
infisical_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
infisical_container_extra_arguments: "{{ infisical_container_extra_arguments_auto + infisical_container_extra_arguments_custom }}"
infisical_container_extra_arguments_auto: []
infisical_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
infisical_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
infisical_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
infisical_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
infisical_http_header_permissions_policy: "{{ 'interest-cohort=()' if infisical_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
infisical_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if infisical_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `infisical_http_header_permissions_policy`
infisical_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `infisical_http_header_strict_transport_security`
infisical_hsts_preload_enabled: false

# List of systemd services that the Infisical systemd service depends on
infisical_systemd_required_services_list: "{{ infisical_systemd_required_services_list_default + infisical_systemd_required_services_list_auto + infisical_systemd_required_services_list_custom }}"
infisical_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
infisical_systemd_required_services_list_auto: []
infisical_systemd_required_services_list_custom: []

# List of systemd services that the Infisical systemd service wants
infisical_systemd_wanted_services_list: "{{ infisical_systemd_wanted_services_list_default + infisical_systemd_wanted_services_list_auto + infisical_systemd_wanted_services_list_custom }}"
infisical_systemd_wanted_services_list_default: []
infisical_systemd_wanted_services_list_auto: []
infisical_systemd_wanted_services_list_custom: []

# Controls `TimeoutSec` value on the n8n systemd service
# Setting an empty value respects the default one
infisical_systemd_docker_base_timeout_sec: ""

# Controls how long to wait for the container to stop gracefully before killing it.
infisical_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
infisical_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
infisical_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
infisical_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ infisical_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ infisical_container_stop_grace_time_seconds }} {{ infisical_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ infisical_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ infisical_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ infisical_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ infisical_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ infisical_identifier }} after {{ infisical_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify database configuration
infisical_database_hostname: ""
infisical_database_port: 5432
infisical_database_username: infisical
infisical_database_password: ""
# Specify SSL mode for Postgres database server
# By default, we expect a local container (without SSL), so attempting SSL connections is not necessary.
# Valid values: see https://www.postgresql.org/docs/11/libpq-ssl.html#LIBPQ-SSL-SSLMODE-STATEMENTS
infisical_database_sslmode: disable
infisical_database_name: infisical

# Specify configuration for Redis or Valkey server
infisical_redis_hostname: ""
infisical_redis_port: 6379
infisical_redis_database: 0

# Specify the timezone
infisical_environment_variables_tz: UTC

# Specify a random 16-byte hex string
# generated with `openssl rand -hex 16` or in another way.
infisical_environment_variables_encryption_key: ""

# Specify a random 32-byte base64 string
# generated with `openssl rand -base64 32` or in another way.
infisical_environment_variables_auth_secret: ""

infisical_environment_variables_db_connection_uri: "postgresql://{{ infisical_database_username }}:{{ infisical_database_password }}@{{ infisical_database_hostname }}:{{ infisical_database_port }}/{{ infisical_database_name }}?sslmode={{ infisical_database_sslmode }}"

infisical_environment_variables_site_url: "{{ infisical_scheme }}://{{ infisical_hostname }}"

infisical_environment_variables_redis_url: "redis://{{ infisical_redis_hostname }}:{{ infisical_redis_port }}/{{ infisical_redis_database }}"

# Additional environment variables.
# See: https://infisical.com/docs/self-hosting/configuration/envars
infisical_environment_variables_additional_variables: ""

# infisical_restart_necessary controls whether the Infisical systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
infisical_restart_necessary: false
