---
- name: Perform Teable installation tasks
  when: teable_enabled | bool
  tags:
    - setup-all
    - setup-teable
    - install-all
    - install-teable
  block:
    - name: Validate Teable configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Teable
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Teable uninstallation tasks
  when: not teable_enabled | bool
  tags:
    - setup-all
    - setup-teable
  block:
    - name: Uninstall Teable
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
